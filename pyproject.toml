[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bace"
version = "0.2.0"
description = "Transient charge-extraction measurement (BACE / TDCF), ported from LabVIEW"
requires-python = ">=3.11"   # tomllib
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8"]

[project.optional-dependencies]
rig = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
# `anthropic` and `openai` are the console's assistant (`bace/service/providers.py`):
# Claude, and any OpenAI-compatible endpoint. The service runs without them, and
# the assistant says what is missing; the versions are the ones the request
# shapes were checked against.
service = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "anthropic>=2.3", "openai>=3.40"]
# The lab PC runs the service on the real rig, so it needs both: `pip install -e .[lab]`.
lab = ["bace[rig,service]"]
# `httpx2` is Starlette's TestClient transport, so `tests/test_service_api.py`
# cannot even be collected without it -- a fresh `pip install -e .[service,dev]`
# failed at import with a message about a package nothing here names. It is a
# *test* dependency and not a service one: the service itself never makes an
# HTTP request. (Starlette took `httpx` until it deprecated it in favour of
# `httpx2`; both still work, and this is the one it asks for.)
dev = ["pytest>=7", "httpx2>=2"]

[tool.setuptools.packages.find]
include = ["bace*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
