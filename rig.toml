# The bench configuration records the hardware used for each measurement.
# Each run's HDF5 file includes these values. Update them after rewiring.
# An incorrect R_s rescales every Q; an incorrect recipe repeats unintended
# measurement settings. Measurement settings belong in run.toml
# (manual 1.2, 3.3).

[electrical]
sense_resistor_ohm = 4.94       # R_s, the current chain's conversion factor in V/A,
                                # measured with 4.58 kOhm on the current cable (± 2 %).
                                # 5.192 until then; files record the value they used.
                                # Q scales as 1/R_s; an error here rescales every Q
                                # (manual 2.3, 2.4).
pulse_amp = 4.07                # Gain of the bias amplifier on the sample holder,
                                # measured at the cable end (± 2 %, probe tolerance);
                                # 4 until then. The 81150A levels are divided by it
                                # (manual 1.2).
probe_attenuation = 1.0
trigger_offset_s = 35.1e-9      # Field latency: the voltage step's 50 % point is 35.1 ns
                                # after trigger + :PULS:DEL1, measured with a 56 pF
                                # capacitor in the device's place (manual 2.2;
                                # docs/notes.md). It positions the integration
                                # window relative to field arrival. :PULS:DEL1 receives
                                # delay_ns unchanged, as required for the LabVIEW timing
                                # match. Adding the latency to the command separates the
                                # spikes by about 48 ns on this bench.
current_sign = -1               # Dimensionless sign applied once in Infiniium._fetch
                                # with division by R_s (manual 2.3, 3.2). It sets the
                                # recorded current sign without changing device voltage.
                                # Bench comparison with LabVIEW gives correlation 0.9988
                                # after sign reversal, with peak, decay time and Q
                                # differing by 6 %, 3 % and 4 % (measured on this
                                # bench). Do not change generator polarity to change a
                                # recorded sign: :OUTP1:POL changes the physical voltage
                                # and the extracting edge.

[timing]
light_path_delay_ns = 502.0      # Drive-edge to light-off delay: 502 ns; 419 ns is the
                                # 85 m fibre (manual 1.2;
                                # docs/figures/bace-timing.html). Informational only:
                                # trigger_offset_s places the integration window, not
                                # this value.

[scope]
address = "TCPIP0::PwM-DSO9054H.local::inst0::INSTR"
current_source = "CHAN2"        # CHAN2 reads voltage across R_s for current (manual
                                # 1.2).
channel = 2
trigger_source = "CHAN3"        # 81150A Sync records trigger timing; field arrival adds
                                # delay and latency (manual 1.2, 2.2).
trigger_positive = true

[bias]
address = "GPIB0::12::INSTR"    # 81150A bias source, GPIB address 12 (manual 1.2).

[sourcemeter]
address = "GPIB0::24::INSTR"    # 2400 DC source, firmware C34, GPIB 24.
# These bench limits cap the per-run compliance in run.toml, in A and V.
# The pixel determines the working limits. The 2400 can supply 1 A, which
# can damage a small cell (docs/ui-rules.md).
max_current_compliance_a = 0.05
max_voltage_compliance_v = 5.0

[led]
address = "GPIB0::15::INSTR"    # 33220A LED drive, GPIB address 15 (manual 1.2).
threshold_v = 1.0               # Lasing threshold of the light source (a 520 nm laser
                                # diode, called the LED in the code) at the generator:
                                # 1 V, 4 V at the diode through the x4 light amplifier.
                                # Above it the diode's current rises steeply with the
                                # level; it may not exceed 2.4 A (manual 1.2).

# The service opens the 1918-C USB device through bace/drivers/newport1918c/.
# Only one process can own the meter. A separate meter console at
# D:/1918cPowerMeter holds its USB handle and makes a direct open fail with
# "no Newport device found", even with a connected cable. Set console to
# that console's HTTP address when it owns the meter; leave it empty for
# direct access.
[power_meter]
console = ""                    # Empty selects direct USB; use http://127.0.0.1:8918
                                # when the meter console owns it.
averaging = true                # DC-continuous mode and 5 Hz analog filtering average
                                # the pulsed light (docs/service-contract.md). At
                                # 500 Hz and 50 % duty, mean power is half the on
                                # power. Without filtering a reading samples full
                                # power, zero or a changing phase. false disables
                                # filtering but still sets the mode.
digital_filter = 100            # 100 samples of digital smoothing over the analog
                                # filter; 0 disables PM:DIGITALFILTER.
wavelength_nm = 520.0           # The source's wavelength, which sets the detector's
                                # responsivity (manual 1.2). Readings taken at the
                                # earlier 530 nm setting are low by the ratio of the
                                # responsivities at 530 and 520 nm.
on_beam_splitter = true         # The beam splitter permits power read-back during a run
                                # (manual 1.2).
dll_path = ""                   # Empty selects usbdll.dll for the interpreter
                                # architecture. The driver package includes both builds;
                                # loading the wrong one gives WinError 193. A path
                                # overrides selection.

[dio]
# The DIO assignments and polarities are measured on this bench
# (docs/bench-checkout.md). Module 0 at 1 opens the shutter and produces photocurrent.
# Module 1 at 1 connects the 2400; at 0 it connects the bias amplifier.
# At +0.5 V with module 1 at 0, the 2400 reads 4.75e-11 and 4.76e-11 A
# (open input, 0.26 % apart). At 1 it reads 4.76e-7 A in the dark and
# -7.78e-5 A under light. The four-decade change distinguishes the routes.
# Repeat python -m bace.bench --dio after rewiring (docs/notes.md).
module_id = 9
shutter_module_nr = 0           # Module 0: 1 opens the shutter, 0 shuts it (manual
                                # 1.2).
relay_module_nr = 1             # Module 1: 1 selects the 2400, 0 the bias amplifier
                                # (manual 1.2).
channel = 0
dll_path = ""                   # Empty selects DELIB for the interpreter architecture:
                                # 32-bit delib.dll in SysWOW64, 64-bit delib64.dll in
                                # System32. ctypes requires the matching build; a path
                                # overrides selection.

# The service opens the Lake Shore 331 through bace/drivers/lakeshore331/.
# A temperature loop writes the setpoint, requires the reading to remain
# inside its tolerance for hold_s, and records each node in the journal.
# A timeout or refusal pauses for the operator. Without a controller, the
# operator enters the temperature at the pause; the bench card gives the reason.
#
# The service reads the controller every 5 s by default. The options
# --temperature-monitor SECONDS and --no-temperature-monitor control polling.
# Read-back and journal entries include the reading's age. Polls require the
# worker's GPIB bus lock, so acquisition skips them and the card marks stale
# readings (docs/service-contract.md).
#
# Only one process can query the 331: it answers the last query received.
# The console at D:/TemperatureController and this service would read each
# other's replies on GPIB0::7. Set console to the HTTP address when that
# console owns the instrument; leave it empty for direct access.
#
# The run writes only the setpoint. Heater range, PID, ramp and loop wiring
# are front-panel settings that the service only reads (manual 1.2).
[temperature]
console = ""                    # Empty selects direct GPIB; use http://127.0.0.1:8331
                                # when the 331 console owns it.
address = "GPIB0::7::INSTR"     # The bench 331 answers at GPIB 7; its factory default
                                # is 12. Empty address and console disable the
                                # controller without a missing-instrument warning.
max_setpoint_k = 350.0          # 350 K cryostat ceiling; higher requests are refused.
                                # Clamping would conceal an unsafe request (manual 1.2).
control_loop = 1                # 1 selects heater output; 2 selects analog output. Both
                                # can be active, so choosing the wrong loop can fail
                                # silently.
