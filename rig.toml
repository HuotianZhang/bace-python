# The bench. Change this file when someone rewires something.
#
# Everything here is a property of the hardware, not of a measurement, and every
# value is copied into each run's HDF5 file so a result carries the bench it came
# from. The measurement recipe lives in run.toml instead — the split matters
# because a stale rig.toml silently rescales every charge, while a stale run.toml
# merely repeats a measurement you did not mean to repeat.
#
# Confirmed on 'sternwarte', 2026-08-31.

[electrical]
sense_resistor_ohm = 5.192      # between the device and CHAN2. Q is proportional
                                # to 1/R, so this is the most consequential
                                # number in the file. Panel note: "(50 old big
                                # Amp) (5.192 new Amp)"
pulse_amp = 4.0                 # voltage gain of the amplifier in the bias path
                                # only; the measured current does not pass it
probe_attenuation = 1.0
trigger_offset_s = 0.0          # added to delay_ns before :PULS:DEL1.
                                # Measured 2026-09-02 against the LabVIEW
                                # engine: same Delay(ns)=90, the dark trace's
                                # displacement spike landed 48 ns apart, which
                                # is exactly the 47 ns this used to add. The
                                # original's looping path — the one a scan
                                # takes — has no offset. See core/pulses.py.
current_sign = -1               # multiplied once, in Infiniium._fetch, beside
                                # the division by sense_resistor_ohm. Measured
                                # 2026-09-02 against the LabVIEW engine, same
                                # device, eight minutes apart: the port read
                                # every current positive, LabVIEW every one
                                # negative, same shape and size (dark trace
                                # corr(-bare, lv) = 0.9988; peak 6 %, tau 3 %,
                                # Q 4 % apart). A convention of the digitiser
                                # chain, not physics. Do NOT fix a sign with
                                # the generator's polarity switch: :OUTP1:POL
                                # changes the voltage the device really sees
                                # (which pulse edge extracts); this changes
                                # only the sign of the number written down.

[timing]
light_path_delay_ns = 502.0      # from the 33220A's drive edge to the light going
                                # off at the sample: 502 ns measured 2026-09-01
                                # (419 ns of it the 85 m fibre), see
                                # docs/bace-timing.html. Informational: the delay
                                # axis is zeroed by trigger_offset_s, not by this.

[scope]
address = "TCPIP0::PwM-DSO9054H.local::inst0::INSTR"
current_source = "CHAN2"        # device current through the sense resistor
channel = 2
trigger_source = "CHAN3"        # 81150A sync — the only in-band record of when
                                # the field actually arrived
trigger_positive = true

[bias]
address = "GPIB0::12::INSTR"    # Agilent 81150A

[sourcemeter]
address = "GPIB0::24::INSTR"    # Keithley 2400, firmware C34
# Bench ceilings, not working values. The compliance a measurement actually uses
# depends on the pixel and lives in run.toml; these are the limits no recipe may
# exceed, because a 2400 will happily push 1 A into a small cell.
max_current_compliance_a = 0.05
max_voltage_compliance_v = 5.0

[led]
address = "GPIB0::15::INSTR"    # Agilent 33220A
threshold_v = 1.0               # generator voltage at which the LED lights,
                                # referred back through its fixed amplifier

# The 1918-C. This program opens the USB device itself; the driver lives in
# bace/drivers/newport1918c/ and nothing else has to be running.
#
# Only one process can hold the meter. That is why `console` exists and why it
# is empty: if the meter's own console (D:/1918cPowerMeter) is started, it
# takes the handle and this program's open fails with a bare "no Newport device
# found" that reads like a cable fault. Name the console here and the service
# asks it over HTTP instead -- the escape hatch, not the normal path.
[power_meter]
console = ""                    # "http://127.0.0.1:8918" only if that console runs
wavelength_nm = 530.0           # responsivity is wavelength dependent; a meter
                                # left at the wrong value returns a plausible
                                # number that is wrong by tens of percent
on_beam_splitter = true         # so it can be read during a run
dll_path = ""                   # empty = pick the usbdll.dll matching this
                                # interpreter. The Newport driver package
                                # installs both builds, so taking the first one
                                # found picks wrong half the time and yields a
                                # bare WinError 193. Set a path to override.

[dio]
# Both assignments and both polarities MEASURED on the rig, 2026-09-01, by
# walking all four states and reading the Keithley in each (`--dio`):
#
#   module 0 = 1 : photocurrent appears        -> module 0 moves the LIGHT
#   module 1 = 1 : the device conducts at all  -> module 1 moves the PATH
#
#   probe current at +0.5 V, module 1 = 0 : 4.75e-11, 4.76e-11 A  (open input,
#                                           the two agree to 0.26 %)
#   probe current at +0.5 V, module 1 = 1 : 4.76e-07 A dark, -7.78e-05 A lit
#
# Four decades between them, so this is not a close call. Before that it rested
# on `shutter_lv2012.vi` (which does hard-code module 0) plus my reading of
# `open/close shutter 2` in BACE_Mehrdad.vi, which the binary never calls a relay.
module_id = 9
shutter_module_nr = 0           # 1 = open, 0 = closed
relay_module_nr = 1             # 1 = Keithley 2400, 0 = amplifier
channel = 0
dll_path = ""                   # empty = pick the DELIB build matching this
                                # interpreter. Deditec ships 32-bit as
                                # delib.dll in SysWOW64 and 64-bit as
                                # delib64.dll in System32; ctypes can only load
                                # the matching one. Set a path to override.

# Lake Shore 331. This program opens the GPIB session itself; the driver lives
# in bace/drivers/lakeshore331/ and nothing else has to be running.
#
# With the instrument answering, every temperature loop settles through it: the
# service writes the setpoint, polls until the reading has held inside the
# loop's tolerance for hold_s, marks each node in the journal, and pauses for
# the operator only on a timeout or a refusal. With no 331 on the bench,
# temperature stays a number someone types at the pause, and the reason is on
# the bench card.
#
# The one-owner rule still holds: the 331 answers only the last query it
# received, so if the 331 console (D:/TemperatureController) is started beside
# this program, both hold GPIB0::7 and both read the other's replies. Name it
# in `console` and the service asks it over HTTP instead -- the escape hatch,
# not the normal path.
#
# What a run never drives, either way: the heater range, the PID, the ramp and
# the loop wiring. Those are set on the front panel and only read back here.
[temperature]
console = ""                    # "http://127.0.0.1:8331" only if that console runs
address = "GPIB0::7::INSTR"     # address 7 is what this instrument answers on;
                                # the manual's factory default is 12, so a
                                # fresh box would differ. Clear this AND
                                # `console` to say there is no cryostat on
                                # this bench: then nothing is opened and the
                                # card says nothing, rather than reporting a
                                # missing instrument nobody expected
max_setpoint_k = 350.0          # REFUSED above this, never clamped: quietly
                                # giving 350 K for a requested 400 K hides the
                                # mistake. Set for the current cryostat.
control_loop = 1                # 1 = heater output, 2 = analog voltage output.
                                # A choice, not something to infer -- both can
                                # be active and writing to the wrong one fails
                                # silently.
