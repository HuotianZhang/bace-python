<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>BACE console — bench tab, off fixtures</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script type="module">
// A harness, not a deliverable: the real shell of `app.js` and the real
// `views/bench.js`, fed from `fixtures/` with a stub api, so the implemented
// bench tab can be looked at with no service running.
import { createStore, currentRun } from './lib/store.js';
import { h, fill, keyed } from './lib/dom.js';
import * as fmt from './lib/format.js';
import { renderRail, renderChainStrip } from './lib/rail.js';
import { renderMonitor } from './lib/monitor.js';
import bench from './views/bench.js';
import rig from './views/rig.js';

const store = createStore({ schedule: (fn) => requestAnimationFrame(fn) });

const tabsEl = h('nav.tabs');
const chipsEl = h('span.chips');
const railEl = h('header.rail');
const monitorEl = h('section.monitor', { hidden: true });
const viewEl = h('main.view');
const stripEl = h('div.strip');
const barEl = h('footer.stream-bar.idle');

document.getElementById('app').replaceChildren(
  h('div.bar', h('span.wordmark', 'bace'), tabsEl, h('span.spacer'), chipsEl),
  railEl, monitorEl, viewEl, stripEl, barEl);

// Two of the four tabs are drawable with no service: the bench, and the rig
// tab whose drawings are static. The other two need `GET /runs`.
const route = () => (location.hash === '#/rig' ? 'rig' : 'bench');
function renderTabs() {
  fill(tabsEl, ['bench', 'pipeline', 'results', 'rig'].map((name) => h('a', {
    href: '#/' + name, class: name === route() ? 'on' : '', text: name })));
}
renderTabs();

const api = {
  validate: async () => ({ checks: [] }),
  setParams: async (module, params) => {
    const entry = store.getState().modules.byName[module];
    const next = { ...entry, params: entry.params.map((p) => (p.name in params
      ? { ...p, value: params[p.name], source: params[p.name] === null ? 'default' : 'edited' } : p)) };
    return next;
  },
  action: async () => ({ bench: store.getState().bench }),
  startRun: async () => { throw Object.assign(new Error('offline'), { text: 'offline harness: POST /runs was not sent' }); },
  // The bench save, in memory. There is no `<out>` here, so a saved bench
  // lasts until the tab is reloaded — enough for the row the bench tab draws
  // over it (name, picker, drift note, apply), which is the point of the
  // harness: the real one writes a file and this one does not have to.
  savedBench: async () => ({ presets: presets.slice().sort((a, b) => b.saved_at - a.saved_at) }),
  saveBench: async (name) => {
    const { order, byName } = store.getState().modules;
    const bench = Object.fromEntries(order.map((n) => [n, Object.fromEntries(
      (byName[n].params || []).map((p) => [p.name, { value: p.value, source: p.source }]))]));
    const record = { name, saved_at: Date.now() / 1000, bench };
    presets = [...presets.filter((p) => p.name !== name), record];
    return { name, path: `<offline>/bench/${name}.json` };
  },
};
let presets = [];

let stripStatus = null;
function notify(text, level = 'warn', checks = null) {
  stripStatus = { level, text, checks };
  renderChainStrip(stripEl, store.getState(), { status: stripStatus, onFix: () => {}, onPark: () => {} });
}

function renderChips(state) {
  const s = state.session || {};
  keyed(chipsEl, JSON.stringify([s.mode, state.benchState]), () => [
    h('span.chip', { text: 'fixtures · offline' }),
    h('span.chip', { text: s.mode || fmt.ABSENT }),
    h('span', { class: 'chip state ' + (state.benchState || 'idle'), text: state.benchState || 'idle' }),
  ]);
}

store.subscribe((state) => {
  renderRail(railEl, state);
  renderChips(state);
  renderMonitor(monitorEl, state, {});
  renderChainStrip(stripEl, state, { status: stripStatus, onFix: () => {}, onPark: () => {} });
  fill(barEl, h('span.dot'), h('span', { text: 'offline harness' }),
    h('span', { text: 'fixtures/modules_sim.json + hello_sim.json' }));
});

const hello = await (await fetch('fixtures/hello_sim.json')).json();
store.applyHello(hello);
store.applyModules(await (await fetch('fixtures/modules_sim.json')).json());
let mounted = null;
function mountView() {
  if (mounted) mounted.dispose();
  const view = route() === 'rig' ? rig : bench;
  mounted = view.mount(viewEl, { store, api, stream: { state: {} }, fmt, notify, park: () => notify('offline: the strip would POST /bench/actions/park') });
  renderTabs();
}
window.addEventListener('hashchange', mountView);
mountView();
</script>
</body>
</html>
