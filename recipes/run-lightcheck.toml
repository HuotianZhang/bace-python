# 看一整个 LED 周期 —— 这不是一次测量，是一张示波器照片。
#
# 前两轮 delay 扫描（2026-09-01 17:27 NORM / 17:59 INV）都证明：5 µs 的记录里
# 光从来没有关过。第一轮是「找不到关光台阶，上界只有平台的 1.3 %」；
# 第二轮是「脉冲后的抽取电流 4 µs 内一点都不衰减」。两个方向指向同一件事。
#
# 而 BACE 的 delay 轴的定义就是「关光到抽取之间的时间」。光不关，这根轴没有意义。
# 所以先别扫 delay，先把光看清楚。
#
# 做法：把时基拉到覆盖一整个 2 ms 周期，跑一个 axis 点。
# configure_timebase 把 :TIM:POS 放在 timebase*4，触发落在记录的 1/10 处，
# 所以窗口 = 触发前 250 µs + 触发后 2.25 ms，完整覆盖 500 Hz 的一个周期。
# light − dark 画出来就是**器件看到的光波形**，以及 5 µs 的测量窗口落在它的哪一段。
#
#   py -3 tools\scan.py --run recipes\run-lightcheck.toml --dry     先看计划
#   py -3 tools\scan.py --run recipes\run-lightcheck.toml           跑
#
# 看什么：
#   1. light − dark 有没有一个 1 ms 高 / 1 ms 低的方波？有 = 光在调制
#   2. 那个下降沿在触发后多少 ns？按时序链应该是 +122 ns
#   3. 如果整条 2.25 ms 都是平的 = LED 的「关」电平 0.4 V 仍在发光。
#      那就把 [illumination] 的 low_level_v 改成 0.0 再跑一次，对比稳态电平
#
# 电荷数字在这里没有意义（积分窗口横跨毫秒），波形才是目的。

[axis]
name = "vpre"                   # 一个点就够；用 vpre 轴只是因为它最简单
start = 0.92
stop = 0.92
step = 1.0
centre_on_voc = false

[pinned]
vpre = 0.92
vcoll = -1.0                    # 和 delay 扫描同一个工作点，波形可以直接对比
delay_ns = 80.0                 # 随便一个扫描里用过的值

[acquisition]
n_loops = 1
n_averages = 4                  # 每次采集要等 4 个 2 ms 周期，别贪多

# --- 关键：时基覆盖一整个 LED 周期 -------------------------------------------
timebase_ns_per_div = 250000.0  # 十格 = 2.5 ms 满屏
record_length = 500000          # 5 ns/样本。:ACQ:MODE RTIM 是**丢样本**式抽取，
                                # 点数不够窄脉冲会整个消失（2026-09-01 CHAN3
                                # 「看起来是平的」就是这么来的）

t0_int_reference = "record"
t0_int_s = 0.0

# --- 基线校正必须关掉 ---------------------------------------------------------
# offset_correct 减掉记录最后 10 % 的平均值。第二轮里那 10 % 不是基线而是稳态
# 抽取电流，于是存进文件的 photo 变成了真实波形的镜像（脉冲前读成 −1.9 mA、
# 脉冲后读成 0），Q 还是个像样的数字 −3.0e−10 C。
# 这一轮尾巴几乎肯定也不是基线，所以关掉。
# （run_transient_scan 现在会自己发一条 warning，但这里本来就不该开。）
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

output_polarity = "NORM"        # 2026-09-02 晚更正：INV 已被推翻（见
                                # run-bace.toml 文件头）。灯光检查本不看偏压，
                                # 但配方不该带着一个已知错误的极性被照抄
inverted_output = false
invert_polarity = true

settle_s = 0.3
dark_settle_s = 0.3
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = false       # 阈值标定是给 5 µs 记录用的，这里没意义
store_shots = false
acquisition_timeout_s = 60.0    # 4 次平均 × 2 ms 周期 + 500k 点传输

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4               # ← 怀疑对象。第二次跑时改成 0.0 对比
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "full LED period - is the light modulated at all"
