# Look at a whole LED period -- this is not a measurement but a scope photograph.
#
# Both earlier delay scans (2026-09-01 17:27 NORM / 17:59 INV) showed that the
# light never goes out anywhere in the 5 us record. The first found no light-off
# step, with an upper bound of 1.3 % of the plateau; the second found an
# extraction current that does not decay at all within 4 us after the pulse.
# Two directions, one conclusion.
#
# And BACE's delay axis is defined as the time between the light going out and
# extraction. If the light does not go out, the axis is meaningless.
# So do not scan delay yet -- get a clear look at the light first.
#
# How: stretch the timebase to cover a whole 2 ms period and run one axis point.
# configure_timebase puts :TIM:POS at timebase*4, so the trigger falls a tenth
# of the way into the record and the window is 250 us before the trigger plus
# 2.25 ms after it -- a complete period at 500 Hz.
# Plotting light - dark then draws **the light waveform the device sees**, and
# shows where in it the 5 us measurement window falls.
#
#   py -3 tools\scan.py --run recipes\run-lightcheck.toml --dry     see the plan first
#   py -3 tools\scan.py --run recipes\run-lightcheck.toml           run it
#
# What to look for:
#   1. does light - dark show a square wave, 1 ms high and 1 ms low? If so the
#      light is being modulated
#   2. how many ns after the trigger is that falling edge? The timing chain
#      says it should be +122 ns
#   3. if the whole 2.25 ms is flat, the LED's "off" level of 0.4 V is still
#      emitting. Set low_level_v under [illumination] to 0.0, run again, and
#      compare the steady levels
#
# The charge number is meaningless here (the integration window spans
# milliseconds); the waveform is the point.

[axis]
name = "vpre"                   # one point is enough; a vpre axis only because it is the simplest
start = 0.92
stop = 0.92
step = 1.0
centre_on_voc = false

[pinned]
vpre = 0.92
vcoll = -1.0                    # the same working point as the delay scans, so the waveforms compare directly
delay_ns = 80.0                 # any value the scans have used

[acquisition]
n_loops = 1
n_averages = 4                  # each acquisition waits 4 x 2 ms periods; do not ask for more

# --- the crux: a timebase covering a whole LED period -----------------------
timebase_ns_per_div = 250000.0  # ten divisions = 2.5 ms full screen
record_length = 500000          # 5 ns/sample. :ACQ:MODE RTIM decimates by
                                # **dropping samples**, and with too few points a
                                # narrow pulse disappears entirely (which is how
                                # CHAN3 "looked flat" on 2026-09-01)

# Q has no physical meaning in this round; the window only has to cover the
# whole 2.5 ms record. The trigger falls at 250 us into the record and the field
# arrives delay + trigger_offset_s (<1 us) after it, so 250 us back from the
# field is the start of the record.
t0_int_s = -250e-6
t_int_width_s = 2.5e-3

# --- the baseline correction must be off ------------------------------------
# offset_correct subtracts the mean of the last 10 % of the record. In the
# second round that 10 % was not baseline but the steady extraction current, so
# the photo stored in the file became a mirror image of the real waveform
# (reading -1.9 mA before the pulse and 0 after it), with Q still coming out a
# presentable -3.0e-10 C.
# The tail here is almost certainly not baseline either, so it is off.
# (run_transient_scan now warns of its own accord, but this file should never
# have had it on.)
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

output_polarity = "NORM"        # corrected the evening of 2026-09-02: INV is
                                # overturned (see the head of run-bace.toml). A
                                # light check does not look at the bias, but a
                                # recipe should not be copied around carrying a
                                # polarity known to be wrong
inverted_output = false
invert_polarity = true

settle_s = 0.3
dark_settle_s = 0.3
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = false       # threshold calibration is for a 5 us record and means nothing here
store_shots = false
acquisition_timeout_s = 60.0    # 4 averages x a 2 ms period + transferring 500k points

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4               # <- the suspect. Set to 0.0 on a second run and compare
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "full LED period - is the light modulated at all"
