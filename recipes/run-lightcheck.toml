# The recipe records a full LED period to check the light waveform.
# Q over this millisecond window does not represent extracted charge.
# A delay scan requires light to switch off; a short record alone cannot
# establish that condition (manual 2.2, 2.4).
# The 2.5 ms record covers one 2 ms period at 500 Hz. :TIM:POS is four
# divisions, placing the trigger 250 µs into the record with 2.25 ms after it.
# Light trace minus dark trace shows the waveform at the device and the
# position of the 5 µs extraction pulse within it.
#
# Check for 1 ms light and 1 ms dark. Light off is expected 122 ns after
# the trigger (manual 1.2).
# If the difference stays flat across 2.25 ms, test whether the 0.4 V LED
# low level emits light: repeat at 0 V and compare steady levels. The power
# meter gives an off level of 0.009 % of the on level on this bench
# (docs/notes.md), so a flat trace alone does not prove continuous light.
#
# Preview: py -3 tools\scan.py --run recipes\run-lightcheck.toml --dry
# Run: py -3 tools\scan.py --run recipes\run-lightcheck.toml

[axis]
name = "vpre"                   # One V_pre point suffices to inspect the LED waveform.
start = 0.92
stop = 0.92
step = 1.0
centre_on_voc = false

[pinned]
vpre = 0.92
vcoll = -1.0                    # V_coll = -1 V permits comparison with delay traces at
                                # the same voltage.
delay_ns = 80.0                 # 80 ns places the step near light off for waveform
                                # comparison (manual 2.2).

[acquisition]
n_loops = 1
n_averages = 4                  # N_avg = 4 takes four 2 ms periods per trace, limiting
                                # acquisition time (manual 2.3).

# The record covers a full 2 ms LED period (manual 1.2, 4.1).
timebase_ns_per_div = 250000.0  # 250000 ns/div gives 2.5 ms, covering a full LED period
                                # (manual 1.2, 4.1).
record_length = 500000          # 500000 samples request 5 ns spacing. :ACQ:MODE RTIM
                                # drops samples; too few can hide a narrow Sync pulse
                                # entirely.

# The integration window covers nearly the full record for waveform inspection.
# The trigger is 250 µs into the 2.5 ms record. Field arrival follows by
# delay + trigger_offset_s, less than 1 µs, so starting 250 µs before the
# field nearly reaches the record start. Q here is not extracted charge
# (manual 2.2).
t0_int_s = -250e-6
t_int_width_s = 2.5e-3

# Baseline correction stays off to preserve the light waveform.
# The default tail region is the last 10 % of the record. It can contain
# steady extraction current rather than baseline. Subtracting it shifts the
# whole difference and hides that current. Bench data show -1.9 mA before
# the pulse and zero after subtraction, with a plausible Q of -3.0e-10 C.
# Inspect the raw difference even if the flatness check gives no warning.
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

output_polarity = "NORM"        # NORM with invert_polarity = true holds V_pre and steps
                                # to V_coll through the inverting bias amplifier. INV
                                # holds V_coll under light and prevents charge
                                # accumulation (docs/notes.md).
inverted_output = false
invert_polarity = true

settle_s = 0.3
dark_settle_s = 0.3
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = false       # false avoids applying short-record threshold
                                # calibration to a full LED period.
store_shots = false
acquisition_timeout_s = 60.0    # 60 s permits four 2 ms acquisitions and transfer of
                                # 500000 samples.

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4               # 0.4 V tests the LED off level; compare a run at 0 V if
                                # steady light is suspected.
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# Temperature comes from the 331 read-back at each node. A temperature
# module settles the controller before measurement. Only a bench without a
# controller needs a typed temperature_k in K. The run records whether the
# temperature is read or typed, so a recipe cannot mislabel it (manual 3.3, 4.1).
operator = ""
comment = "full LED period - is the light modulated at all"
