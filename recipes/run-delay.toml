# delay 扫描 — 用来标定 delay 轴的零点，不是一次正式测量。
#
# 目的：找到 Q(delay) 的拐点，也就是「抽取场恰好在样品处光灭时到达」的那个设定。
# 拐点直接给出零点，不需要知道 t_bias（81150A 输出 -> 器件响应，实测 47-62 ns，
# 带 15 ns 展宽）。见 claude/bace-trigger-chain.md。
#
#   py -3 tools\scan.py --run recipes\run-delay.toml --dry     先看计划
#   py -3 tools\scan.py --run recipes\run-delay.toml           跑

[axis]
name = "delay_ns"
start = 0.0                     # delay_ns 就是 :PULS:DEL1，不再加任何命令偏移
stop = 240.0                    # （之前 -40…200 加 47 ns 偏移 = 7…247 ns，这里等价）
step = 40.0                     # 7 点
centre_on_voc = false           # delay 轴用不了，Axis 会直接拒绝

[pinned]
vpre = 0.8                     # V at the device — 实测 V_oc 0.9187 / 0.9222
                                # delay 轴不能 centre_on_voc，所以这是手填的。
                                # 器件或光强变了就要重测。
vcoll = -2.0                    # 安全值。先用它定拐点位置，确认无误再用 -4 复测
delay_ns = 88.0                 # 被轴覆盖，留着只是为了让文件读得完整

[acquisition]
n_loops = 3                     # 49 x 3 = 147 shots，约 3 分钟
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

# --- 找光照零点：积分必须在每个 delay 点都正确 --------------------------------
# 找零点有两件不同的事：
#   1. 找**积分**零点（瞬态从哪开始、t0_int 取多少）——是数据分析的事，采一次，
#      事后在存好的轨迹上换 t0_int 重算 Q 即可：tools/reintegrate.py。
#   2. 找**光照**零点（本文件）——改电脉冲相对 LED 关断的时间，看 Q(delay) 在哪拐。
#      这一轮里积分必须"永远正确"：窗口相对瞬态的位置固定，随 delay 一起平移。
# 示波器触发在 81150A 的 Sync 上，而 Sync **不**被 :PULS:DEL1 延迟——只有输出被
# 延迟。所以窗口一律从场到达算起（trigger + :PULS:DEL1 + rig.toml 的
# trigger_offset_s），起点和终点都跟着 delay 走：
#
#   记录里的积分起点 = t0_int_s + delay_ns + trigger_offset_s − t0
#   其中 t0 = :WAV:XOR?，由 timebase 决定（500 ns/div 时 −500 ns）
#
# 之前这里用 trigger + 0"覆盖整条记录"来找零点，那是把 1 的办法用在 2 上：
# 每个点被切掉的部分不一样，Q(delay) 一半是物理一半是窗口。
t0_int_s = -2e-9                # 台阶前 2 ns 开始
t_int_width_s = 1.5e-6          # 约 6 tau；5 µs 记录装得下

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0
offset_correct = true

# --- 输出极性：INV（2026-09-01 17:59 起）-------------------------------------
# 81150A 的基线电平是器件在脉冲之间所处的电压。第一轮（17:27）用 "leave" 跑，
# 读回来是 NORM，原始波形显示：脉冲**前**器件一直在抽取 1.9 mA、脉冲把抽取关掉。
# 也就是基线是 vcoll、脉冲顶是 vpre，整个测量反着跑。
#
# 判定不需要知道器件怎么接的，走的是 V_oc：photo ≈ 0 的那个电平按定义就是 V_oc，
# 而独立测得 V_oc = 0.906–0.922 V ≈ vpre = +0.92 V。它出现在脉冲顶上，
# 所以基线是抽取电平 —— 这正是 NORM 的行为。BACE 要的是「停在 vpre、脉冲到
# vcoll」，即基线必须是 HIGH 电平，也就是 INV。
# （如果器件正负极接反了，photo ≈ 0 会出现在基线上。它没有。接线是按预期的。）
#
# 第二轮（17:59，INV）确认：脉冲前原始 light − dark = 0.04 mA（停在 V_oc），
# 脉冲后 1.91 mA（抽取）。形状对了。
# 仍未解决的是**光根本没关**，见 claude/bace-delay-scan-01.md 第三节 —— 那个
# INV 修不了。
output_polarity = "NORM"        # 2026-09-02 晚更正：INV 已被推翻，见
                                # run-bace.toml 文件头
inverted_output = true         # output_polarity = "leave" 时被忽略
invert_polarity = true

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "delay scan to calibrate the zero of the delay axis"
