# The delay scan locates the light-off time from the knee of Q(delay).
# At the knee, field arrival coincides with light off at the device. This
# checks timing on the device without a separate bias-path delay estimate.
# The fitted field latency is 47.1 ns; the device response locates light off
# to about ±15 ns (manual 2.2; docs/figures/bace-timing.html).
#
# Preview: py -3 tools\scan.py --run recipes\run-delay.toml --dry
# Run: py -3 tools\scan.py --run recipes\run-delay.toml

[axis]
name = "delay_ns"
start = 0.0                     # 0 ns is the lowest :PULS:DEL1; no command offset is
                                # added (manual 2.2, 4.2).
stop = 240.0                    # 240 ns spans the expected light-off knee near 75 ns
                                # (manual 2.2).
step = 40.0                     # 40 ns gives seven points to bracket the knee.
centre_on_voc = false           # false uses absolute V_pre in V; a delay axis cannot
                                # centre on V_oc (manual 4.1).

[pinned]
vpre = 0.8                     # V_pre = 0.8 V, typed for the delay axis. Bench V_oc
                                # readings are 0.9187 and 0.9222 V, so this is below
                                # V_oc. Remeasure V_oc when device or illumination
                                # changes.
vcoll = -2.0                    # V_coll = -2 V locates the knee before a stronger field
                                # is tried. Repeat at -4 V only within the device limits
                                # (manual 2.4).
delay_ns = 88.0                 # 88 ns is overridden by the delay axis (manual 4.1).

[acquisition]
n_loops = 3                     # Three loops repeat seven points for 21 shots (manual
                                # 2.3).
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

# The integration window follows field arrival at every point.
# Choosing its start and locating light off are separate tasks. Stored traces
# can be integrated with other starts using tools/reintegrate.py. The delay
# scan moves the voltage step relative to light off to locate the knee in Q.
# Both ends of its integration window must follow that step, or each point
# loses a different part of its transient and distorts Q(delay).
# The 81150A Sync triggers the digitiser; :PULS:DEL1 delays only the output.
# Window start in record time = t0_int_s + delay_ns + trigger_offset_s - t0,
# where t0 is :WAV:XOR? (-500 ns at 500 ns/div). The start is 2 ns before
# field arrival (manual 2.2).
t0_int_s = -2e-9                # Integration start in s relative to field arrival; -2
                                # ns includes the leading edge (manual 2.2).
t_int_width_s = 1.5e-6          # 1.5 µs window follows delay; about six 250 ns decay
                                # times. It fits in the 5 µs record at every point but
                                # can omit a slow tail (manual 2.2).

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0
offset_correct = true

# The polarity pair holds V_pre between pulses and steps to V_coll.
# The inverting bias amplifier requires invert_polarity = true and NORM
# (docs/notes.md). INV with that software setting holds V_coll between
# pulses, so extraction continues under light. Check the raw light trace
# minus dark trace: it must approach zero after extraction. V_oc measured
# under the same LED level checks V_pre independently.
output_polarity = "NORM"        # NORM with invert_polarity = true holds V_pre and steps
                                # to V_coll through the inverting bias amplifier. INV
                                # holds V_coll under light and prevents charge
                                # accumulation (docs/notes.md).
inverted_output = true         # Ignored with explicit output_polarity; applies only to
                               # "auto".
invert_polarity = true

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# Temperature comes from the 331 read-back at each node. A temperature
# module settles the controller before measurement. Only a bench without a
# controller needs a typed temperature_k in K. The run records whether the
# temperature is read or typed, so a recipe cannot mislabel it (manual 3.3, 4.1).
operator = ""
comment = "delay scan to calibrate the zero of the delay axis"
