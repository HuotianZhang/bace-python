# A delay scan -- to calibrate the zero of the delay axis, not a real measurement.
#
# The point: find the knee of Q(delay), which is the setting at which the
# extraction field arrives exactly as the light goes out at the sample. The knee
# gives the zero directly, with no need to know t_bias (81150A output ->
# device response, measured at 47-62 ns with a 15 ns spread).
# See claude/bace-trigger-chain.md.
#
#   py -3 tools\scan.py --run recipes\run-delay.toml --dry     see the plan first
#   py -3 tools\scan.py --run recipes\run-delay.toml           run it

[axis]
name = "delay_ns"
start = 0.0                     # delay_ns is :PULS:DEL1; no command offset is added any more
stop = 240.0                    # (previously -40...200 plus a 47 ns offset = 7...247 ns; equivalent)
step = 40.0                     # 7 points
centre_on_voc = false           # meaningless on a delay axis; Axis refuses it outright

[pinned]
vpre = 0.8                     # V at the device -- V_oc measured at 0.9187 / 0.9222
                                # a delay axis cannot centre_on_voc, so this is
                                # typed by hand. Re-measure it whenever the
                                # device or the intensity changes.
vcoll = -2.0                    # the safe value. Locate the knee with it first, then repeat at -4 once confirmed
delay_ns = 88.0                 # overridden by the axis; kept only so the file reads completely

[acquisition]
n_loops = 3                     # 49 x 3 = 147 shots, about 3 minutes
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

# --- finding the illumination zero: the integral must be right at every point
# Finding a zero is two different jobs:
#   1. the **integration** zero (where the transient starts, what t0_int should
#      be) is a matter of data analysis: acquire once, then recompute Q on the
#      stored traces with a different t0_int -- tools/reintegrate.py.
#   2. the **illumination** zero (this file): move the electrical pulse relative
#      to the LED switching off, and see where Q(delay) turns.
#      Here the integral must be right *always*: the window keeps a fixed
#      position relative to the transient and shifts with delay.
# The scope triggers on the 81150A's Sync, and the Sync is **not** delayed by
# :PULS:DEL1 -- only the output is. So the window is always measured from the
# field's arrival (trigger + :PULS:DEL1 + rig.toml's trigger_offset_s), and both
# ends follow delay:
#
#   the integration start in the record = t0_int_s + delay_ns + trigger_offset_s - t0
#   where t0 = :WAV:XOR?, set by the timebase (-500 ns at 500 ns/div)
#
# This file used to use trigger + 0 to "cover the whole record", which applies
# job 1's method to job 2: each point loses a different piece, and half of
# Q(delay) is then physics and half of it is the window.
t0_int_s = -2e-9                # start 2 ns before the step
t_int_width_s = 1.5e-6          # about 6 tau; it fits in a 5 us record

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0
offset_correct = true

# --- output polarity: INV (from 2026-09-01 17:59) ---------------------------
# The 81150A's baseline level is the voltage the device sits at between pulses.
# The first round (17:27) ran with "leave", read back NORM, and the raw waveform
# showed the device extracting 1.9 mA **before** the pulse, with the pulse
# switching extraction off. That is, the baseline was vcoll and the pulse top
# vpre: the whole measurement running backwards.
#
# The judgement needs no knowledge of the wiring; it goes through V_oc. The
# level at which photo ~ 0 is by definition V_oc, and V_oc measured
# independently is 0.906-0.922 V ~ vpre = +0.92 V. It appeared on the pulse top,
# so the baseline was the extracting level -- which is exactly NORM's behaviour.
# BACE wants "rest at vpre, pulse to vcoll", i.e. the baseline must be the HIGH
# level, which is INV.
# (Were the device terminals reversed, photo ~ 0 would appear on the baseline.
# It did not. The wiring is as expected.)
#
# The second round (17:59, INV) confirmed it: raw light - dark reads 0.04 mA
# before the pulse (resting at V_oc) and 1.91 mA after it (extracting). The
# shape is right.
# What is still unresolved is that **the light never goes out** -- see section
# three of claude/bace-delay-scan-01.md; INV does not fix that.
output_polarity = "NORM"        # corrected the evening of 2026-09-02: INV is
                                # overturned, see the head of run-bace.toml
inverted_output = true         # ignored when output_polarity = "leave"
invert_polarity = true

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "delay scan to calibrate the zero of the delay axis"
