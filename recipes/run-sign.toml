# Combination 3: invert_polarity = true + :OUTP1:POL = NORM -- the one cell of
# the table that had never been run.
#
# Evening of 2026-09-02: 3 is the validated combination. bare.py --invert at
# 02:08 (generator at NORM) agreed with LabVIEW to 4 %, and the service
# reproduced the same combination at 15:37 (Q -1.7e-10, tail at zero). 4=INV is
# the wrong one -- through the inverting amplifier the device rests at v_coll
# and extraction never stops. run.toml is fixed at 3.
#
# The point: measure the sign -- is the generator's positive the device's
# positive? -- directly, instead of inferring it from the J-V.
# 3 and 2 (false + INV, which is what 17:59 / 18:09 / 18:11 ran) are each
# other's negation at the device: two sign versions of one experiment:
#
#   2  amplifier output  baseline +0.80 V  ->  pulse -2.00 V
#   3  amplifier output  baseline -0.80 V  ->  pulse +2.00 V
#
# How to read it (use the raw light - dark, not the photo stored in the file):
#   ~0 before the pulse, steady extraction after the step -> this cell's
#       baseline is V_oc, and this sign is the right one
#   a large current before the pulse, zero after the step -> the baseline is
#       the extracting level, the sign is backwards, and the other cell is right
# 2 already gave the first shape (0.06 -> +4.45 mA). If 3 gives it too, then
# something else is at work and both cells need looking at again.
#
# Safety: 3 is the safest of the four cells. The **baselines** of the light and
# dark branches (99.75 % of every 2 ms) are -0.80 V and 0 V, which cannot hold
# the device in forward bias for long whichever way round it is wired; only the
# 5 us pulse reaches +/-2.0/2.8 V. Compare 1 (a dark baseline of -1.92 V held
# indefinitely) and 4 (a dark baseline of +2.80 V held indefinitely).
#
#   py -3 tools\scan.py --run recipes\run-sign.toml --dry
#   py -3 tools\scan.py --run recipes\run-sign.toml
#
# Compare the result against the 18:11 round: identical voltages, LED and
# timebase, differing only in this one sign.

[axis]
name = "delay_ns"
start = 0.0                     # delay_ns is :PULS:DEL1, and cannot be negative
stop = 240.0
step = 120.0                    # 3 points: 0 / 120 / 240 (previously -40/80/200 plus a 47 ns command offset = 7/127/247)
centre_on_voc = false

[pinned]
vpre = 0.80
vcoll = -2.00
delay_ns = 80.0

[acquisition]
n_loops = 1                     # 3 shots, about 10 seconds. This is a reading, not a measurement
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

t0_int_s = -2e-9                # from 2 ns before the field arrives (trigger + :PULS:DEL1 + trigger_offset_s)
t_int_width_s = 1.5e-6          # enough to judge the sign; both ends of the window follow delay

# Baseline correction off: when the light does not go out, the last 10 % is
# steady-state signal rather than baseline, and the correction subtracts the
# signal away, turning the waveform into its own mirror image (which is what
# happened in the 18:15 round, where Q still came out a presentable
# -3.0e-10 C). What this round is looking for is precisely whether there is a
# steady current after the step, so the raw difference is what must be read.
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

# --- the whole point of this round is these two lines -----------------------
invert_polarity = true          # software layer: negate both voltages (their ordering flips too)
output_polarity = "NORM"        # instrument layer: the baseline is the LOW level
inverted_output = false         # ignored unless output_polarity is "auto"

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "sign test - combination 3, invert true + NORM"
