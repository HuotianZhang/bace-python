# The recipe checks the voltage sign at the device from the raw trace difference.
# The bias amplifier inverts. invert_polarity = true with NORM holds V_pre
# between pulses and steps to V_coll (docs/notes.md). With these settings,
# amplifier output levels are -0.80 V between pulses and +2.00 V during
# the pulse. false with INV gives the opposite levels, +0.80 and -2.00 V.
#
# A difference near zero before the step and extraction after it identifies
# the level near V_oc. A large current before the step and zero after it
# indicates extraction between pulses. If both polarity choices give the
# first shape, check illumination and routing before accepting either.
# Use raw light trace minus dark trace; a baseline taken from steady
# extraction current hides the sign test (manual 2.3).
#
# The light and dark trace levels between pulses are -0.80 and 0 V for
# 99.75 % of each 2 ms period. Only the 5 µs pulse reaches magnitudes of
# 2.0 and 2.8 V. This limits sustained forward bias with either device
# orientation. Other polarity pairs can hold a dark level of -1.92 or
# +2.80 V between pulses, which risks sustained forward bias. Check the
# device limits before changing polarity.
#
# Preview: py -3 tools\scan.py --run recipes\run-sign.toml --dry
# Run: py -3 tools\scan.py --run recipes\run-sign.toml
# Compare polarity choices at identical voltage magnitudes, LED level and
# timebase, so only the voltage sign changes.

[axis]
name = "delay_ns"
start = 0.0                     # 0 ns is the lowest allowed :PULS:DEL1 (manual 4.2).
stop = 240.0
step = 120.0                    # 120 ns gives three points at 0, 120 and 240 ns to
                                # check the sign (manual 4.1).
centre_on_voc = false

[pinned]
vpre = 0.80
vcoll = -2.00
delay_ns = 80.0

[acquisition]
n_loops = 1                     # One loop gives three shots for a sign check (manual
                                # 4.1).
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

t0_int_s = -2e-9                # Integration start in s relative to field arrival; -2
                                # ns includes the leading edge (manual 2.2).
t_int_width_s = 1.5e-6          # 1.5 µs window follows delay; about six 250 ns decay
                                # times. It fits in the 5 µs record at every point but
                                # can omit a slow tail (manual 2.2).

# Baseline correction stays off to expose steady extraction current.
# If light stays on, the last 10 % can contain signal. Subtracting that
# region shifts the entire difference and forces its late level to zero.
# A plausible Q of -3.0e-10 C is measured on this bench under that condition.
# Inspect the raw difference to judge the sign.
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

# These settings control the voltage sign at the device (docs/notes.md).
invert_polarity = true          # Swaps and negates both voltage levels for the device
                                # orientation; a wrong sign changes every Q (manual 4.1).
output_polarity = "NORM"        # NORM with invert_polarity = true holds V_pre and steps
                                # to V_coll through the inverting bias amplifier. INV
                                # holds V_coll under light and prevents charge
                                # accumulation (docs/notes.md).
inverted_output = false         # Ignored with explicit output_polarity; applies only to
                                # "auto".

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# Temperature comes from the 331 read-back at each node. A temperature
# module settles the controller before measurement. Only a bench without a
# controller needs a typed temperature_k in K. The run records whether the
# temperature is read or typed, so a recipe cannot mislabel it (manual 3.3, 4.1).
operator = ""
comment = "sign test - combination 3, invert true + NORM"
