# 组合 ③：invert_polarity = true + :OUTP1:POL = NORM —— 表里唯一没跑过的那一格。
#
# 2026-09-02 晚：③ 就是验证过的组合。02:08 的 bare.py --invert（发生器 NORM）
# 与 LabVIEW 差 4%；15:37 服务层同一组合复现（Q −1.7e−10，尾部归零）。④=INV
# 反而是错的——器件经反相放大器歇在 v_coll，抽取不停。run.toml 已按 ③ 固定。
#
# 目的：直接测出"发生器的正 = 器件的正吗"这个符号，不再从 JV 推。
# ③ 和 ②（false + INV，也就是 17:59 / 18:09 / 18:11 跑的那个）在器件上互为负号，
# 是同一个实验的两个符号版本：
#
#   ②  放大器输出  基线 +0.80 V  →  脉冲 −2.00 V
#   ③  放大器输出  基线 −0.80 V  →  脉冲 +2.00 V
#
# 判读（用原始 light − dark，不是存进文件的 photo）：
#   脉冲前 ≈ 0、台阶后进入稳定抽取  →  这一格的基线才是 V_oc，这个符号是对的
#   脉冲前有大电流、台阶后归零      →  基线是抽取电平，符号反了，另一格才对
# ② 已经给出了前一种形状（0.06 → +4.45 mA）。如果 ③ 也给前一种，那说明有别的东西
# 在起作用，两格都要重新审。
#
# 安全性：③ 是四格里最安全的一格。亮暗两支的**基线**（占 2 ms 里的 99.75%）分别是
# −0.80 V 和 0 V，不管器件哪个朝向都不会长时间正偏；只有 5 µs 的脉冲会碰到 ±2.0/2.8 V。
# 对比 ①（暗态基线 −1.92 V 长期挂着）和 ④（暗态基线 +2.80 V 长期挂着）。
#
#   py -3 tools\scan.py --run recipes\run-sign.toml --dry
#   py -3 tools\scan.py --run recipes\run-sign.toml
#
# 跑完之后和 18:11 那一轮对比：两者的电压、LED、时基完全一样，只差这一个符号。

[axis]
name = "delay_ns"
start = -40.0
stop = 200.0
step = 120.0                    # 3 点：−40 / 80 / 200，其中 +80 和 18:11 直接可比
centre_on_voc = false

[pinned]
vpre = 0.80
vcoll = -2.00
delay_ns = 80.0

[acquisition]
n_loops = 1                     # 3 shots，约 10 秒。这是一次判读，不是测量
n_averages = 20
timebase_ns_per_div = 500.0
record_length = 5000

t0_int_reference = "trigger"
t0_int_s = 0.0

# 关掉基线校正：光没关的时候，尾部 10 % 是稳态信号而不是基线，校正会把信号减掉、
# 把波形变成自己的镜像（18:15 那一轮就是这样，Q 还是个像样的 −3.0e−10 C）。
# 这一轮要看的正是"台阶后有没有稳态电流"，所以必须看原始差值。
offset_correct = false

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

# --- 这一轮的全部意义就在这两行 ---------------------------------------------
invert_polarity = true          # 软件层：把两个电压取负（大小排序也跟着翻）
output_polarity = "NORM"        # 仪器层：基线 = LOW 电平
inverted_output = false         # output_polarity 不是 "auto" 时被忽略

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "sign test - combination 3, invert true + NORM"
