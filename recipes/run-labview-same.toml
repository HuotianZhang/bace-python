# The comparison version of run-labview.toml: **only the dark_reference line
# differs**.
#
# This file uses dark_reference = "same": the levels do not change between light
# and dark, and the shutter is the only thing that does. The voltage step is
# bit-identical and the displacement current cancels exactly, but in the dark
# the device is held at the prebias.
# run-labview.toml uses translated (the normal way): dark has vpre=0 and
# vcoll=vcoll-vpre.
#
# Run the two back to back and compare three things:
#   1. the light/dark residual at the displacement spike (translated gave
#      +0.054 mA last round; same should come closer to zero)
#   2. whether the peak in the gap moves -- if it does, part of the 3.7x is an
#      artefact of how the subtraction is done
#   3. how far apart Q is
#
# Against the LabVIEW panel -- combination 4's polarity, every other parameter
# copied item by item, to see whether it agrees.
#
# The reference panel (BACE Parameter + LED Setup/Pulse Mode):
#   Vpre_Start 1.00354   Vpre_End 1.02354   dV 0.01        -> 3 points
#   Vcoll -1             Delay(ns) 90       Pulse Width 5e3
#   Timebase 200 ns      Record Length 5e3  t0 Integration 320e−9
#   # Averages 200       # of Loops 1
#   LED 1 V / Voltage_Low 0.4 V / 500 Hz / Duty 50 %
#   offset corr? ON ("Subtract mean of last 200 values")
#   Resistor 5.192       Pulse Amp 4        Probe Attenuation 1
#   scale 1.5 / offset 2 (that is autorange's scale_factor / offset_divisor)
#   Wait before measure 0.2 s
#
# The reference results from the panel, to compare against directly:
#   Charge          ~ -9.2e-10 C (the three Vpre points differ by only ~0.7 %)
#   PhotoCurrent peak ~ -3.7 mA, back to zero within 2 us
#   raw light/dark trace peak ~ -27 mA
#
#   py -3 tools\scan.py --run recipes\run-labview.toml --dry
#   py -3 tools\scan.py --run recipes\run-labview.toml
#
# ! The panel carries a "positive jSC?" ("if activated, positive voltage is
#   applied to ITO"), and it is on. It is the only control on the panel that
#   looks like a polarity switch, and it very likely feeds `:OUTP1:POL`. This
#   file uses combination 4 (true + INV) -- if Q disagrees while the shape of
#   the waveform agrees, the first thing to check is where that control goes
#   inside the VI.

[axis]
name = "vpre"
start = 1.00354                 # copied verbatim from the panel
stop = 1.02354
step = 0.01                     # 3 points: 1.00354 / 1.01354 / 1.02354
centre_on_voc = false           # the panel takes absolute values typed by hand, not a span around V_oc

[pinned]
vpre = 1.00354                  # overridden by the axis
vcoll = -1.00                   # panel Vcoll(V) = -1
delay_ns = 90.0                 # panel Delay(ns) = 90.
                                # :PULS:DEL1 receives 90, exactly as the VI
                                # sends it -- the program no longer adds an
                                # offset to the command (before 2026-09-02 it
                                # added 47 ns, and the two displacement spikes
                                # were measured 48 ns apart). trigger_offset_s
                                # in rig.toml is now the physical sync->field
                                # delay, used only to place the integration
                                # window.

[acquisition]
n_loops = 1                     # panel # of Loops = 1
n_averages = 200                # panel # Averages = 200

# --- sampling: the most consequential change of this round -------------------
# The panel is 200 ns/div -> 2 us full screen, with 5000 points = 0.4 ns/sample.
# Earlier rounds used 500 ns/div + 5000 points and the scope returned only 3125
# points = 1.6 ns/sample, four times coarser than the panel. The rising edge of
# the extraction spike is only tens of ns, and 1.6 ns/point is not enough.
# :ACQ:POIN is a request, not a promise: the runner prints the dt it actually
# got, and when that disagrees the answer has to be something other than
# lowering record_length (:ACQ:MODE RTIM decimates by dropping samples, and a
# narrow pulse can disappear entirely when there are too few).
timebase_ns_per_div = 200.0
record_length = 5000

# --- the integration window: converting the panel's record reference ---------
# The panel's t0 Integration is 320 ns from the **first sample of the record**,
# integrated to the end of the record (2 us). The window here is always measured
# from the field's arrival (trigger + :PULS:DEL1 + rig.toml's
# trigger_offset_s); at 200 ns/div the trigger falls at 200 ns into the record,
# delay is 90 and the latency 47.1:
#   320 - 200 - 90 - 47.1 = -17.1 ns, width 2000 - 320 = 1680 ns. The window
# starts 17 ns before the field, consistent with the 16.5 ns relation in the
# archive. Equivalent to the panel only at delay = 90 and 200 ns/div.
t0_int_s = -17.1e-9
t_int_width_s = 1.68e-6

offset_correct = true           # panel offset corr? ON

# --- what changes between light and dark ------------------------------------
# "translated" (the default, and the convention this port rebuilt from the VI):
# dark repeats the same voltage **span** but translated to start from 0 V. For
# this round, at the device:
#     light  baseline -1.01354 V -> pulse +1.00000 V
#     dark   baseline  0.00000 V -> pulse +2.01354 V
# The same span over a different absolute interval, so the displacement current
# only cancels cleanly where C(V) is flat.
#
# "same": the levels do not change, and **the shutter is the only thing that
# differs between light and dark**. The voltage step is bit-identical and the
# displacement current cancels exactly. The cost is that in the dark the device
# is held at the prebias (here +1.01 V of forward bias at the device, close to
# V_oc, with a forward current of order Jsc*A -- not dangerous).
#
# translated is what BACE ought to do and is the rebuilt convention, so this
# file uses it. "same" is only for comparison -- see run-labview-same.toml,
# which is identical to this file apart from that one line.
dark_reference = "same"

pulse_width_ns = 5000.0         # panel Pulse Width (ns) 5e3
pulse_frequency_hz = 500.0      # panel Freq 500 Hz
duty_percent = 50.0             # panel Duty Cycle 50 %

# --- combination 4's polarity ------------------------------------------------
invert_polarity = true
output_polarity = "NORM"        # corrected the evening of 2026-09-02: 4=INV is
                                # overturned, see the head of run-bace.toml;
                                # copying the panel means NORM
inverted_output = false

# --- the wait between the shutter and acquisition ----------------------------
# The gap fixed on 2026-09-01: dark_settle_s used to sleep **before the shutter
# shut**, so acquisition began the instant it closed, giving neither the
# mechanical shutter nor the device any settle time at all -- while light had
# settle_s. When only one of two traces is allowed to settle, their difference
# cannot be trusted.
# shutter_settle_s now applies after the shutter moves on **both** branches.
# The panel's "Wait before measure 0.2 s" is its own counterpart; this is more
# generous.
settle_s = 0.3
dark_settle_s = 0.3
shutter_settle_s = 0.7          # wait after the shutter has moved, on both branches

read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false
acquisition_timeout_s = 60.0    # 200 averages x a 2 ms period = 0.4 s, plus the transfer

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 1000            # panel Settle Time Jsc/Voc/Jsat = 1000 ms
settle_voc_ms = 1000
settle_jsat_ms = 1000
nplc = 1.0
averaging = 10                  # panel Voc/Jsc/Jsat Averages = 10
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.000                 # panel LED Voltage = 1 (not 1.020)
low_level_v = 0.4               # panel Voltage_Low = 0.4
v_sat = -1.0                    # panel Vcoll corresponding to Jsat = -1

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "LabVIEW panel replica - combination 4 - shutter only dark"
