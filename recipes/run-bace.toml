# ! Corrected the evening of 2026-09-02: combination 4 (true + INV) is
# overturned, and this recipe now uses combination 3 (true + NORM).
# bare.py --invert at 02:08, with the generator at NORM, agreed with LabVIEW to
# 4 %, and the bit-exact read-back at 02:20 shows LabVIEW itself finishing at
# NORM; the service reproduced it under NORM at 15:37 (Q -1.7e-10, tail at
# zero), while INV at 14:52 flipped the sign of the spike and collapsed the
# photo peak to 0.23 mA -- through the inverting x4 amplifier, INV rests the
# device at v_coll while it is lit, extraction never stops, and no charge
# accumulates. The combination-4-era comments below are kept as history; the
# criterion itself (light - dark must be zero in the steady state) still
# stands.
#
# (original text) The real measurement for combination 4 -- invert_polarity =
# true + :OUTP1:POL = INV.
#
# Why combination 4: it is the only one of the four that **decays to zero**.
# That is not a matter of taste but the criterion: light - dark must be zero in
# the steady state, or carriers are still being generated during extraction and
# what is measured is not the extracted charge.
# The offline integrals of the seven delay points of the 18:15 round (raw
# light - dark, integrated from the step to the end of the record):
#
#   Q      = -4.05 ... -4.41e-10 C   the 7 points scatter 4 %, the integral converges
#   tau1/e = 248 ... 301 ns          consistent
#   level over the last 1 us = -0.035 ... -0.045 mA  ~ 0
#
# Against combination 2 at the same voltage (18:11): the last 1 us reads
# +4.455 mA, the same integral gives 1.9e-8 C, and it grows linearly with the
# integration window -- that is not a charge but a steady current times a time.
#
# The baseline is the shallower level (the prebias) and the pulse is the deep
# +/-2 V level (extraction). Both the light and dark curves saturating at the
# step is normal: that is displacement current, identical in both branches, and
# it subtracts away.
#
#   py -3 tools\scan.py --run recipes\run-bace.toml --dry
#   py -3 tools\scan.py --run recipes\run-bace.toml
#
# ! If the runner reports clipped, look at how many points: three of the seven
#   in the 18:15 round hit the bottom of the range at the peak (7-8 consecutive
#   samples at one float inside a single trace, an 11 ns flat top).
#   Q scatters by only 4 %, so the 11 ns clipped away contributes little -- but
#   the peak height is unusable.
#   Autorange currently has no switch in run.toml to disable it or bound it;
#   ask and one will be added.

[axis]
name = "delay_ns"
start = 0.0                     # delay_ns is :PULS:DEL1; no command offset is added any more
stop = 440.0                    # (previously -40...400 plus a 47 ns offset = 7...447 ns; equivalent)
step = 20.0                     # 23 points. tau ~ 265 ns, so this span shows the decay
centre_on_voc = false

[pinned]
vpre = 0.80
vcoll = -2.00
delay_ns = 80.0

[acquisition]
n_loops = 5                     # 23 x 5 = 115 shots, about 2.5 minutes
n_averages = 40
timebase_ns_per_div = 500.0
record_length = 5000

# --- the integration window follows the pulse (now the only way) ------------
# Measured (a 49-point fit, residual 1.5 ns): the field at the device = trigger
# + :PULS:DEL1 + 47.1 ns. Those 47.1 ns now live in rig.toml's
# trigger_offset_s, and t0_int_s is relative to the field's arrival directly:
#
#   window start (record time) = t0_int_s + delay_ns + trigger_offset_s - t0
#                              = t0_int_s + delay_ns + 547.1 ns   (t0 = -500 ns)
#   window end                 = start + t_int_width_s
#
# t0_int_s = -2 ns: the window starts 2 ns before the step, every delay point is
# treated alike, and both ends follow the pulse.
t0_int_s = -2e-9
t_int_width_s = 1.5e-6          # the furthest point's window reaches ~2.5 us, which fits in a 5 us record

# In this round the tail really is baseline (the last 1 us reads ~0.04 mA), so
# the baseline correction is doing what it should.
# run_transient_scan checks itself with baseline_is_flat() and warns outright
# when the tail is not flat.
offset_correct = true

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

# --- the validated combination is 3 (corrected 2026-09-02, see the head) -----
invert_polarity = true          # software layer: negate both voltages (their ordering flips with them)
output_polarity = "NORM"        # instrument layer. INV rests the device at v_coll and extraction never stops
inverted_output = false         # ignored unless output_polarity is "auto"

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# temperature_k is deliberately not typed here (2026-09-04): every recipe said
# 290 and a run at 220 K was filed as "290 K, typed". A bench with a 331 reads
# the controller as each node starts (how = "read"), a temperature node settles
# it, and only a bench with no controller should type a number here -- the
# file will say it was typed.
operator = ""
comment = "BACE delay scan - combination 4"
