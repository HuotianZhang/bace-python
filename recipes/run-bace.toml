# The recipe measures Q against delay with the device held at V_pre
# between pulses and stepped to V_coll. The inverting bias amplifier requires
# invert_polarity = true with NORM. INV holds the device at V_coll under
# light, so extraction continues and charge cannot accumulate (docs/notes.md).
#
# A near-zero late difference and Q = -1.7e-10 C are measured on this
# bench with this polarity pair. INV gives a peak as low as 0.23 mA.
# Light trace minus dark trace must approach zero after extraction. A steady
# current makes Q grow with the integration window and includes carriers
# generated during extraction (manual 2.2, 2.4).
# Bench data for a decaying difference give Q = -4.05 to -4.41e-10 C over
# seven delay points (4 % scatter), a 1/e decay time of 248 to 301 ns, and
# -0.035 to -0.045 mA over the last 1 µs. A steady difference of +4.455 mA
# gives 1.9e-8 C and an integral that grows with the window. These values
# are measured on this bench; a decaying shape alone does not validate polarity.
#
# Both traces contain the displacement spike. Equal peaks between traces
# are expected and subtract; clipping within either trace is a hazard.
# Seven or eight consecutive equal samples, an 11 ns flat peak on this bench,
# make the peak height unusable even when Q scatters by only 4 %.
# Auto-range has no recipe switch to disable or bound it. Reject clipped
# shots (manual 4.2).
#
# Preview: py -3 tools\scan.py --run recipes\run-bace.toml --dry
# Run: py -3 tools\scan.py --run recipes\run-bace.toml

[axis]
name = "delay_ns"
start = 0.0                     # 0 ns is the lowest :PULS:DEL1; no latency is added to
                                # the command (manual 2.2, 4.2).
stop = 440.0                    # 440 ns spans the decay; delay is sent unchanged
                                # (manual 2.2).
step = 20.0                     # 20 ns gives 23 points across a decay near 265 ns,
                                # measured on this bench.
centre_on_voc = false

[pinned]
vpre = 0.80
vcoll = -2.00
delay_ns = 80.0

[acquisition]
n_loops = 5                     # Five loops give 115 shots for statistics over the 23
                                # points (manual 2.3).
n_averages = 40
timebase_ns_per_div = 500.0
record_length = 5000

# The integration window follows field arrival at every delay point.
# The fitted latency is 47.1 ns over 49 points, with a 1.5 ns residual
# (manual 2.2; docs/notes.md). It belongs in rig.toml's trigger_offset_s,
# which positions the window without changing :PULS:DEL1.
# Window start in record time = t0_int_s + delay_ns + trigger_offset_s - t0.
# At t0 = -500 ns this is t0_int_s + delay_ns + 547.1 ns.
# The end is start + t_int_width_s. Starting 2 ns before the field includes
# the spike and treats every point alike (manual 2.2).
t0_int_s = -2e-9
t_int_width_s = 1.5e-6          # 1.5 µs window follows delay; about six 250 ns decay
                                # times. It fits in the 5 µs record at every point but
                                # can omit a slow tail (manual 2.2).

# Baseline correction requires a region without extraction current.
# A late level near 0.04 mA is measured on this bench. A flat tail alone
# does not prove extraction is complete; it can contain steady current.
# baseline_is_flat() warns about a varying tail. Check the stored traces
# before accepting Q.
offset_correct = true

pulse_width_ns = 5000.0
pulse_frequency_hz = 500.0
duty_percent = 50.0

# The polarity pair holds V_pre between pulses (docs/notes.md).
invert_polarity = true          # Swaps and negates both voltage levels for the device
                                # orientation; a wrong sign changes every Q (manual 4.1).
output_polarity = "NORM"        # NORM with invert_polarity = true holds V_pre and steps
                                # to V_coll through the inverting bias amplifier. INV
                                # holds V_coll under light and prevents charge
                                # accumulation (docs/notes.md).
inverted_output = false         # Ignored with explicit output_polarity; applies only to
                                # "auto".

settle_s = 0.2
dark_settle_s = 0.2
read_intensity = true
trigger_sweep = "AUTO"
calibrate_trigger = true
store_shots = false

[sourcemeter]
current_compliance_a = 0.01
voltage_compliance_v = 2.0
settle_jsc_ms = 500
settle_voc_ms = 500
settle_jsat_ms = 500
nplc = 1.0
averaging = 1
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.020
low_level_v = 0.4
v_sat = -1.0

[sample]
sample = ""
material = ""
pixel = ""
# Temperature comes from the 331 read-back at each node. A temperature
# module settles the controller before measurement. Only a bench without a
# controller needs a typed temperature_k in K. The run records whether the
# temperature is read or typed, so a recipe cannot mislabel it (manual 3.3, 4.1).
operator = ""
comment = "BACE delay scan - combination 4"
