# The recipe sets one measurement and is copied verbatim into its output.
# Hardware properties belong in rig.toml. The polarity pair matches the
# LabVIEW program: invert_polarity = true and output_polarity = "NORM"
# (docs/notes.md). The manual covers timing and measurement limits.

[axis]
name = "vpre"                   # Scan V_pre or V_coll in V, or delay in ns (manual
                                # 4.1).
start = 0.0                     # V offset from V_oc; zero selects V_pre = V_oc (manual
                                # 4.1).
stop = 0.0
step = 0.0
centre_on_voc = true
# Equal start and stop select one point. Loops repeat the shot at V_oc
# without averaging over curvature in Q(V_pre). For three points around
# V_oc, use offsets -0.001 to +0.001 V in 0.001 V steps (manual 4.1).

[pinned]
vcoll = -1.0                    # V_coll in V at the device; check device limits (manual
                                # 2.4, 4.1).
delay_ns = 90.0   # 90 ns gives field arrival about 15 ns after light off (manual 1.2,
                  # 2.2).

[acquisition]
n_loops = 100
n_averages = 200   # N_avg = 200 per trace; 50 gives three times the scatter per loop on
                   # this bench (manual 2.3).
timebase_ns_per_div = 1000.0    # 1000 ns/div gives 10 µs: 1 µs before the trigger for
                                # baseline and 9 µs after. A 2 µs record omits
                                # extraction current and gives Q 10-20 % low (manual
                                # 2.2, 2.3).
record_length = 10000           # 10000 requested samples; the instrument returns record
                                # width times sample rate. Bench read-back gives 6250
                                # for a 5 µs record (0.8 ns spacing) and 20000 for 20 µs
                                # (1 ns), despite requests of 10000 and 25000.
                                # Processing uses the returned length (measured on
                                # this bench).
t0_int_s = -2e-9                # Starts 2 ns before field arrival: trigger + :PULS:DEL1
                                # + trigger_offset_s. Both window ends follow delay, so
                                # every point includes the same part of its transient.
                                # The dark trace removes displacement charge where
                                # capacitance matches. A trigger-relative window would
                                # cut different parts at different points (manual 2.2).
t_int_width_s = 6e-6            # 6 µs balances charge collection against drift. With a
                                # null run subtracted, 96 % is collected at 6 µs and 98
                                # % at 8 µs relative to 15 µs. Drift is about ±3 µA
                                # per shot, so its charge error grows with window width.
                                # The run warns if the record ends first (manual 2.2,
                                # 2.3).
pulse_width_ns = 10000.0        # 10000 ns outlasts the 6 µs integration window and 9 µs
                                # after-trigger record, excluding the return step. It
                                # fits within the 2 ms period (manual 2.2).
pulse_frequency_hz = 500.0        # 500 Hz on both generators is the bench operating
                                # rate (manual 1.2).
duty_percent = 50.0
offset_correct = true           # Subtracts the baseline selected by offset_region
                                # before integrating Q (manual 2.3).
offset_region = "pre-trigger"   # Uses the pre-trigger baseline; the last 10 % can
                                # contain extraction current and bias Q low (manual
                                # 2.3).
alternate_order = true          # Dark trace first on even loops; stable drift cancels
                                # over loop pairs (manual 2.3).
inverted_output = false   # Ignored with explicit output_polarity. Under "auto",
                                # polarity selects the level between pulses. Holding
                                # V_coll under light prevents charge accumulation
                                # (docs/notes.md).
invert_polarity = true   # Swaps and negates both voltage levels for the device
                                # orientation; a wrong sign changes every Q (manual 4.1).
output_polarity = "NORM"       # NORM with invert_polarity = true matches the LabVIEW
                               # program. Through the inverting bias amplifier it holds
                               # V_pre and pulses to V_coll. INV holds V_coll and
                               # suppresses accumulation: bench peaks fall from about 3
                               # to 0.5 mA and Q by about a factor of ten.
settle_s = 0.5   # 0.5 s after light levels are set; shorter trace spacing reduces drift
                 # (manual 2.3).
dark_settle_s = 0.5   # 0.5 s after dark levels, before shutter closure; shutter
                      # settling follows separately (manual 4.1).
shutter_settle_s = 1.0          # 1 s after shutter motion for both traces. At 294 K,
                                # 0.5/0.5/1 s and 2/2/5 s agree in Q within uncertainty.
                                # They take 6.3 and 17.3 s per shot, with scatter 0.009
                                # and 0.021 nC per loop. Shorter spacing reduces
                                # amplifier drift. Check settling at the coldest
                                # temperature, where the device is slowest (manual 2.3;
                                # docs/analysis/2026-10-26/scope-window/README.md).
read_intensity = true
trigger_sweep = "AUTO"          # AUTO matches the LabVIEW sequence and acquires without
                                # a trigger. A loose Sync cable can give noise with
                                # near-zero Q that looks plausible. TRIG waits and times
                                # out without Sync; use it after checking the trigger
                                # path (manual 4.2; docs/notes.md).
calibrate_trigger = true        # Sets trigger threshold to max(CHAN3) * 0.5 *
                                # attenuation, in V, to follow the Sync amplitude
                                # (manual 4.1).
external_trigger = true         # Arms the 81150A from 33220A Sync. Free-running pulses
                                # can give plausible Q at a random LED phase (manual
                                # 1.2, 4.1).
trigger_slope_positive = true   # Rising Sync edge arms the 81150A at light off with the
                                # 33220A output inverted (manual 1.2).
store_shots = false             # false omits individual shot traces; storing 51 points
                                # over 100 loops takes about 163 MB (manual 4.1).

[sourcemeter]
# The pixel determines the per-run compliance, in A and V. These values
# must stay within rig.toml's bench limits (manual 4.2).
current_compliance_a = 0.01     # 0.01 A ceiling while sourcing voltage for DC current
                                # or J-V (manual 4.1).
voltage_compliance_v = 2.0      # 2 V ceiling while sourcing 0 A for V_oc (manual 4.1).
settle_jsc_ms = 1000
settle_voc_ms = 1000   # 1000 ms at 0 A before V_oc read-back; slow devices need time to
                       # settle (manual 4.1).
settle_jsat_ms = 1000
nplc = 5.0                      # 5 power-line cycles integrate for 100 ms at 50 Hz. One
                                # such reading gives the noise floor of ten 1-cycle
                                # readings in about 0.45 s per point, with one auto-zero
                                # rather than ten (measured on this bench).
averaging = 1                   # One reading disables the repeating filter.
terminals = "FRON"
four_wire = false

[illumination]
level_v = 1.000   # 1.000 V at the 33220A is shared by DC V_oc and the pulse high level,
                                # as required for equal illumination (manual 4.1).
low_level_v = 0.4               # 0.4 V LED low level is below threshold for a dark
                                # half-cycle (manual 4.1).
v_sat = -1.0                    # -1 V at the device for saturation current (manual
                                # 4.1).

[sample]
sample = ""
material = ""
pixel = ""
# Temperature comes from the 331 read-back at each node. A temperature
# module settles the controller before measurement. Only a bench without a
# controller needs a typed temperature_k in K. The run records whether the
# temperature is read or typed, so a recipe cannot mislabel it (manual 3.3, 4.1).
operator = ""
comment = ""
